server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: api-server
  redis:
    host: 192.168.1.25
    port: 6379
    timeout: 2000
  data:
    mongodb:
      uri: mongodb://192.168.1.25:27017/bike_monitor
  kafka:
    bootstrap-servers: 192.168.1.25:9092
    consumer:
      group-id: api-server
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

tdengine:
  url: jdbc:TAOS-RS://192.168.1.25:6041?user=root&password=taosdata&httpConnectTimeout=5000&httpSocketTimeout=30000

h3:
  res: 8

knife4j:
  enable: true
